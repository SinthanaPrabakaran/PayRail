name: PayRail Production AWS ECS Deployment

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# Restrict permissions for least-privilege OIDC token generation
permissions:
  id-token: write # Required for requesting the JWT from GitHub OIDC provider
  contents: read  # Required for actions/checkout

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Publish & Deploy to AWS ECS Fargate
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.target_env || 'production' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Verify that required deployment secrets and configuration exist
      - name: Verify Environment Credentials Availability
        run: |
          if [ -z "${{ secrets.AWS_ROLE_TO_ASSUME }}" ]; then
            echo "=========================================================================="
            echo "⚠️  DEPLOYMENT HALTED: AWS_ROLE_TO_ASSUME secret is not configured."
            echo "PayRail adheres to zero-hardcoded-credentials security standards."
            echo "Follow docs/aws-deployment.md to configure GitHub OIDC IAM Role and secrets."
            echo "=========================================================================="
            exit 1
          fi

      # Assume IAM Role via OIDC (Zero long-lived credentials)
      - name: Configure AWS Credentials (OIDC Least Privilege)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions-PayRailDeployment
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'payrail-api' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Download Active ECS Task Definition
        env:
          ECS_TASK_FAMILY: ${{ vars.ECS_TASK_FAMILY || 'payrail-api' }}
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_FAMILY \
            --query taskDefinition > task-def.json

      - name: Render Task Definition with New Container Image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: payrail-api
          image: ${{ env.IMAGE }}

      - name: Deploy Amazon ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_NAME || 'payrail-api-service' }}
          cluster: ${{ vars.ECS_CLUSTER_NAME || 'payrail-cluster' }}
          wait-for-service-stability: true
