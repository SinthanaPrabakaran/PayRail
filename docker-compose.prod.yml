# ==============================================================================
# PayRail Local Staging Docker Compose File
# - Mirrors production environment topology locally
# - Single-node MongoDB Replica Set (rs0) for ACID multi-document transactions
# - Redis 7.2 with password authentication & append-only persistence
# - RabbitMQ 3.13 with durable queues and management dashboard
# - Application container running non-root with native healthchecks
#
# NOTE FOR PRODUCTION:
# Production environments require managed or properly operated infrastructure:
# - MongoDB: MongoDB Atlas or managed replica set with TLS 1.3, SCRAM-SHA-256,
#   automated snapshots, and VPC private endpoints / peering.
# - Redis: AWS ElastiCache / Redis Cloud with in-transit encryption (TLS),
#   at-rest encryption, auth tokens, multi-AZ replication, and automated failover.
# - RabbitMQ: AWS Amazon MQ / CloudAMQP cluster with TLS, Quorum queues,
#   and dedicated metric alarms (disk alarms, consumer dropoff).
# - Application: AWS ECS Fargate or Kubernetes with IAM roles / OIDC, secrets in
#   AWS Secrets Manager / SSM Parameter Store, and automated rolling deployments.
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: payrail:local-staging
    container_name: payrail-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: /api/v1
      APP_NAME: PayRail
      LOG_LEVEL: info
      MONGODB_URI: mongodb://payrail-mongodb:27017/payrail?replicaSet=rs0&directConnection=true
      REDIS_HOST: payrail-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-payrail_redis_pass_dev}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-payrail}:${RABBITMQ_PASS:-payrail_rabbit_pass_dev}@payrail-rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-payrail_super_secret_jwt_key_dev_mode_32chars}
      JWT_EXPIRES_IN: 15m
      JWT_ISSUER: payrail-auth
      JWT_AUDIENCE: payrail-api
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - payrail-network

  mongodb:
    image: mongo:7.0
    container_name: payrail-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-payrail}
    volumes:
      - mongo_data:/data/db
      - ./scripts/init-mongo-rs.sh:/scripts/init-mongo-rs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27017 --quiet --eval 'try { rs.status().ok } catch(e) { 0 }' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - payrail-network

  mongodb-setup:
    image: mongo:7.0
    container_name: payrail-mongodb-setup
    restart: "no"
    depends_on:
      mongodb:
        condition: service_started
    volumes:
      - ./scripts/init-mongo-rs.sh:/scripts/init-mongo-rs.sh:ro
    entrypoint: ["bash", "/scripts/init-mongo-rs.sh"]
    networks:
      - payrail-network

  redis:
    image: redis:7.2-alpine
    container_name: payrail-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-payrail_redis_pass_dev}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-payrail_redis_pass_dev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - payrail-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: payrail-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-payrail}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-payrail_rabbit_pass_dev}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - payrail-network

networks:
  payrail-network:
    name: payrail-network
    driver: bridge

volumes:
  mongo_data:
    name: payrail_mongo_data
  redis_data:
    name: payrail_redis_data
  rabbitmq_data:
    name: payrail_rabbitmq_data
